name: canary
# Раз в неделю прогон на СВЕЖИХ версиях зависимостей: без ограничений .github/requirements-ci.txt и
# с последней Pydantic AI в venv надстройки. Основной CI закреплён, поэтому выход новой версии чужой
# библиотеки он не видит; адаптер за четыре недели ломался четырежды, и каждый раз пользователь
# замечал позже (BL-LCY-06). Красный canary — сигнал, а не поломка кита: при падении workflow
# открывает issue (одну, пока она не закрыта). Выпуск от него не зависит: release.yml ждёт
# только engine-tests, а этот workflow по расписанию и вручную (Actions → canary → Run workflow).
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-deps:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      # Открыть issue о дрейфе. Больше этот workflow не получает ничего.
      issues: write
    env:
      AURORA_REQUIRE_VENV: "1"
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Engine dependencies (latest, no constraints)
        # requirements.txt закреплён (BL-SEC-21), а canary и нужен, чтобы видеть свежие выпуски: те же имена без версий.
        run: |
          sed 's/==.*//' requirements.txt > "$RUNNER_TEMP/requirements-latest.txt"
          python3 -m pip install --quiet -r "$RUNNER_TEMP/requirements-latest.txt"
      # venv ставит сам движок (`--venv-install` → `aurora_extras.install()`, без пина версии — то есть
      # последняя Pydantic AI), под временным HOME раннера. `runner` в `env:` уровня задания недоступен,
      # поэтому пути задаём шагом; их называет движок, а не YAML. Пути от установки не зависят, поэтому
      # пишутся в GITHUB_ENV ДО неё: несовместимая свежая версия делает установку красной (код 1), а
      # selfcheck и живые проверки ниже всё равно должны смотреть в этот venv и показать настоящую поломку.
      - name: Pydantic AI venv (latest, installed by the engine)
        run: |
          set -euo pipefail
          H="$RUNNER_TEMP/h"
          mkdir -p "$H"
          paths="$(HOME="$H" USERPROFILE="$H" python3 -c "import sys; sys.path.insert(0, 'scripts'); import aurora_extras as E; print(E.EXTRAS['pydantic-ai']['venv'].as_posix()); print(E.venv_python('pydantic-ai').as_posix())")"
          echo "AURORA_ADAPTER_VENV=$(echo "$paths" | sed -n 1p)" >> "$GITHUB_ENV"
          echo "AURORA_ADAPTER_PYTHON=$(echo "$paths" | sed -n 2p)" >> "$GITHUB_ENV"
          HOME="$H" USERPROFILE="$H" python3 scripts/agent_core.py --venv-install --no-quarantine
      # Известные уязвимости того, что стоит в venv надстройки (BL-SEC-21): пакеты по снимку установки, без сети к PyPI
      # за самим снимком. Сигнал, а не поломка: advisory не должен краснить прогон, поэтому шаг не блокирует.
      - name: Known vulnerabilities in the extras venv (pip-audit)
        continue-on-error: true
        run: |
          set -euo pipefail
          echo pip-audit > "$RUNNER_TEMP/audit-requirements.txt"
          python3 -m pip install --quiet -r "$RUNNER_TEMP/audit-requirements.txt"
          "$AURORA_ADAPTER_PYTHON" -m pip freeze --all > "$RUNNER_TEMP/extras-freeze.txt"
          pip-audit --requirement "$RUNNER_TEMP/extras-freeze.txt" --no-deps --disable-pip --progress-spinner off
      - name: Adapter self-check on the latest framework
        id: selfcheck
        # После красной установки (несовместимая версия) всё равно печатаем полный JSON самопроверки.
        if: success() || failure()
        # --selfcheck возвращает 0 при любом итоге, красным шаг делает только проверка ok.
        run: |
          set -euo pipefail
          "$AURORA_ADAPTER_PYTHON" scripts/agents/pydantic_ai_adapter.py --selfcheck | python3 -c "import json,sys; d=json.loads(sys.stdin.read().strip().splitlines()[-1]); print(d); sys.exit(0 if d.get('ok') else 1)"
      - name: Full suite on the latest dependencies
        id: suite
        if: success() || failure()
        run: python3 tests/run_tests.py
      - name: Open an issue if the canary is red
        if: failure()
        run: |
          set -euo pipefail
          TITLE="canary: свежие версии зависимостей ломают проверки"
          if [ -n "$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')" ]; then
            echo "Issue уже открыта — новую не заводим."
            exit 0
          fi
          RUN="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh issue create --title "$TITLE" --body "Еженедельный прогон на свежих версиях (bs4, markdownify, Pydantic AI) покраснел: ${RUN}. Основной CI закреплён и зелёный; разобрать, что изменилось у зависимости, и поправить адаптер или обновить .github/requirements-ci.txt."
