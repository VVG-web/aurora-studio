name: engine-tests
on: [push, pull_request]
jobs:
  tests:
    # Основная проверка — на актуальной версии Python, которую кит рекомендует аналитикам
    # (docs/CONTRIBUTING.md): 3.14. Нижняя поддерживаемая (3.11) проверяется заданием floor.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Проверки JS (панель, скрипты страниц) гонит node; без него они молча пропускаются.
      # Версия закреплена, а не «что есть на образе»: LTS 24.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      # Зеркало Confluence разбирает страницы через beautifulsoup4 и markdownify — их
      # аналитик ставит из «Установки» панели. Без них восемь проверок синка падали
      # здесь «No module named 'bs4'», и проверка кита не была зелёной ни разу с 28.08.
      - name: Engine dependencies
        run: python3 -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Version, CHANGELOG and panel agree
        run: python3 tests/check_release.py
      - name: Smoke (source-scan invariants)
        run: python3 tests/run_tests.py --smoke
      - name: Full suite
        run: python3 tests/run_tests.py
      # Неиспользуемые импорты и переменные и замыкания в цикле: мёртвый код не копится. F821 —
      # имя без определения: пропавший `import` иначе виден только тесту, который дойдёт до этой строки.
      - name: Lint (ruff)
        run: |
          python3 -m pip install --quiet -c .github/requirements-ci.txt ruff
          ruff check --select F401,F841,B023,F821 --output-format github scripts cockpit reports aurora.py
  authors:
    # Автор коммита — только человек (docs/CONTRIBUTING.md): ни имени модели, ни бота, ни
    # трейлера Co-Authored-By с ними. Ассистент в облачной сессии подписывает коммиты своим
    # именем, и в октябре 2026 так в master попали три коммита. Красная проверка видна в PR до
    # слияния, а на master не даёт собраться выпуску (release ждёт зелёный engine-tests).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Commit authors are people
        env:
          # У PR — его база и вершина, у push — прежняя и новая вершина ветки.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SUGGEST_LOGIN: ${{ github.event.pull_request.user.login || github.actor }}
          SUGGEST_ID: ${{ github.event.pull_request.user.id || github.actor_id }}
          OWNER: ${{ github.repository_owner }}
          OWNER_ID: ${{ github.repository_owner_id }}
        run: python3 .github/scripts/check_authors.py "$BASE" "$HEAD_SHA"
  floor:
    # Нижняя поддерживаемая версия — Python 3.11 (политика версий, BL-DEC-01). Строка, понятная
    # только 3.12+ (кавычки того же вида внутри f-строки), роняла kb_lint на старом Python целиком
    # с 1.112.0 по 1.143.0, и проверка на новой версии этого не видела. Задание блокирующее:
    # выпуск ждёт его вместе с основным.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Engine compiles on the lowest supported Python
        run: python3 -m compileall -q scripts cockpit reports aurora.py tests
      - name: Engine dependencies
        run: python3 -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Full suite on the lowest supported Python
        run: python3 tests/run_tests.py
  newer-python:
    # Промежуточные версии между нижней (3.11) и основной (3.14): системная на Ubuntu 24.04 — 3.12,
    # у аналитиков с Homebrew чаще всего 3.13. Политика версий (BL-DEC-01) обещает «3.11+ тестируем»,
    # регрессия, видная только на одной из них, иначе CI не заметит. Пока неблокирующее, как и
    # остальные новые задания матрицы ОС × Python (BL-DEC-02); блокирующим — после зелёных прогонов.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Engine compiles on Python ${{ matrix.python }}
        run: python3 -m compileall -q scripts cockpit reports aurora.py tests
      - name: Engine dependencies
        run: python3 -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Full suite on Python ${{ matrix.python }}
        run: python3 tests/run_tests.py
  legacy-310:
    # Поддержка Python 3.10 заканчивается в октябре 2026 (PEP 619): движок на нём работает, но с предупреждением.
    # Задание не блокирует выпуск (continue-on-error); убрать после 2027-04, когда 3.10 перестанет
    # быть «работает с предупреждением» (календарь пересмотра — в политике версий).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Engine compiles on Python 3.10
        run: python3 -m compileall -q scripts cockpit reports aurora.py tests
      - name: Engine dependencies
        run: python3 -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Smoke (source-scan invariants)
        run: python3 tests/run_tests.py --smoke
  adapter-live:
    # Живой контур надстройки Pydantic AI: настоящий venv, самопроверка адаптера и три проверки на
    # настоящем фреймворке (шлюз с нестандартными метаданными, откат при несовместимом обновлении,
    # ленивый MCP со сторожем). Раньше без `~/.aurora/venv` они возвращали «пропускаем» и считались
    # зелёными, а Windows (`Scripts/python.exe`) пропускал их даже при поставленном venv.
    # AURORA_REQUIRE_VENV=1 превращает пропуск в падение. venv ставится так же, как его ставит
    # панель (`aurora_extras.EXTRAS`), но в папку на раннере, а не в домашнюю. Неблокирующее
    # (BL-DEC-02): красный здесь — сигнал о дрейфе чужой библиотеки, а не повод останавливать выпуск;
    # блокирующим его делают после стабильных зелёных прогонов. Свежие версии — canary.yml.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      AURORA_REQUIRE_VENV: "1"
    steps:
      - uses: actions/checkout@v6
      # Контекст `runner` в `env:` уровня задания недоступен (workflow целиком не проходит проверку),
      # поэтому каталог venv кладём в окружение шагом. Слэши прямые: так путь понимают и bash, и python на Windows.
      - name: Adapter venv location
        shell: bash
        run: echo "AURORA_ADAPTER_VENV=${RUNNER_TEMP//\\//}/adapter-venv" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Engine dependencies
        run: python -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Pydantic AI venv (as the panel installs it)
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$AURORA_ADAPTER_VENV"
          if [ -d "$AURORA_ADAPTER_VENV/Scripts" ]; then VPY="$AURORA_ADAPTER_VENV/Scripts/python.exe"; else VPY="$AURORA_ADAPTER_VENV/bin/python"; fi
          SPEC="$(python -c "import sys; sys.path.insert(0, 'scripts'); import aurora_extras as E; print(' '.join(E.EXTRAS['pydantic-ai']['pip']))")"
          "$VPY" -m pip install --quiet $SPEC
          "$VPY" -c "from importlib.metadata import version; print('pydantic-ai', version('pydantic-ai'))"
      - name: Adapter self-check on the real framework
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$AURORA_ADAPTER_VENV/Scripts" ]; then VPY="$AURORA_ADAPTER_VENV/Scripts/python.exe"; else VPY="$AURORA_ADAPTER_VENV/bin/python"; fi
          # --selfcheck печатает JSON и возвращает 0 при любом итоге: красным шаг делает только проверка ok.
          "$VPY" scripts/agents/pydantic_ai_adapter.py --selfcheck | python -c "import json,sys; d=json.loads(sys.stdin.read().strip().splitlines()[-1]); print(d); sys.exit(0 if d.get('ok') else 1)"
      # Каждая проверка отдельно: --only берёт одну подстроку, а за один прогон нужен весь список падений.
      - name: Live adapter checks
        shell: bash
        run: |
          fail=0
          for name in "pydantic ai reads a gateway with nonstandard metadata" \
                      "a pydantic update is checked before it works" \
                      "mcp servers start only when needed"; do
            python tests/run_tests.py --only="$name" || fail=1
          done
          exit $fail
  windows:
    # Кит ставят и на Windows (start-aurora.bat, install_aurora.py). Кодировка консоли и
    # файлов там cp125x, пути с «\\», открытые файлы нельзя переименовать, нет fcntl и
    # bash — на ubuntu этого не видно. UTF-8-режим сознательно не включаем: аналитик его не
    # включает.
    # Задание БЛОКИРУЮЩЕЕ: release.yml берёт только итог workflow success, а задание с
    # continue-on-error на этот итог не влияет — выпуск ушёл бы при красных тестах на Windows.
    # Версия — 3.12, как у проверенного прогона; 3.14 на Windows идёт отдельным неблокирующим
    # заданием windows-314 (BL-DEC-02), блокирующим его делают после стабильных зелёных прогонов.
    runs-on: windows-latest
    timeout-minutes: 30
    # Полный прогон на Windows занимает ~12 минут, а выпуск ждёт все проверки: набор режется на
    # три доли, и каждая идёт на своей машине (`--shard=i/3` — каждая третья проверка).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Engine dependencies
        run: python -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Smoke (source-scan invariants)
        run: python tests/run_tests.py --smoke
      # Полный набор идёт и после красной проверки инвариантов: за один прогон нужен весь
      # список падений на Windows, а не первое из них.
      - name: Full suite (shard ${{ matrix.shard }} of 3)
        if: success() || failure()
        run: python tests/run_tests.py --shard=${{ matrix.shard }}/3
  windows-314:
    # Windows на основной версии Python (3.14; бинарная сборка с патчами, тогда как для 3.12
    # setup-python на Windows берёт старую 3.12.10). Не блокирует выпуск (continue-on-error):
    # блокирующим остаётся windows на 3.12; перевести сюда после стабильных зелёных прогонов.
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Engine dependencies
        run: python -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Smoke (source-scan invariants)
        run: python tests/run_tests.py --smoke
      - name: Full suite (shard ${{ matrix.shard }} of 3)
        if: success() || failure()
        run: python tests/run_tests.py --shard=${{ matrix.shard }}/3
  macos:
    # Кит ставят и на macOS (start-aurora.command, install_aurora.py): системный Python там старый,
    # пути и оболочка другие, а CI до сих пор macOS не покрывал. Пока неблокирующее
    # (continue-on-error): сделать блокирующим, когда задание станет стабильно зелёным.
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Engine dependencies
        run: python3 -m pip install --quiet -r requirements.txt -c .github/requirements-ci.txt
      - name: Smoke (source-scan invariants)
        run: python3 tests/run_tests.py --smoke
      # Полный набор идёт и после красной проверки инвариантов: за один прогон нужен весь список падений.
      - name: Full suite
        if: success() || failure()
        run: python3 tests/run_tests.py
