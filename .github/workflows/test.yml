name: engine-tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke (source-scan invariants)
        run: python3 tests/run_tests.py --smoke
      - name: Full suite
        run: python3 tests/run_tests.py
