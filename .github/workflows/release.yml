name: release
# Выпуск версии: тег vX.Y.Z и GitHub Release создаёт CI, а не человек со своей машины.
# Версия — файл VERSION, описание выпуска — запись «## X.Y.Z — …» в CHANGELOG.md.
#
# Срабатывает:
#   • после зелёного engine-tests на master — если у текущей VERSION ещё нет Release;
#   • вручную (Actions → release → Run workflow на master) — тот же прогон без ожидания
#     тестов: повторить выпуск, если он не создался.
#
# Безопасно запускать сколько угодно раз: готовый Release и существующий тег не
# перезаписываются. Тег ставится на коммит, который прошёл зелёный engine-tests
# (workflow_run.head_sha), а не на коммит, поднявший VERSION. Если master уже ушёл
# вперёд, workflow ничего не выпускает и пишет об этом.
#
# Отключить выпуск по версии: удалить этот файл или выключить workflow во вкладке Actions.
on:
  workflow_run:
    # Имя — из test.yml. Переименуете там — поправьте и здесь, иначе выпуск молча замолчит.
    workflows: [engine-tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Верхний уровень — потолок для всех заданий. Здесь он обязан быть write: задание ниже
# создаёт тег и Release, а job-level `contents: write` не может поднять потолок.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Только master и только то, что прошло проверки: PR и чужие ветки выпуска не создают.
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Создать тег и Release. Больше этот workflow не получает ничего.
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Ровно тот коммит, что прошёл проверки (при ручном запуске — master).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Права токена
        run: gh api "repos/$GH_REPO" --jq '.permissions'
      - name: Выпустить версию из VERSION
        shell: bash
        env:
          # Автоматический запуск: выпускаем ровно тот коммит, который проверял engine-tests.
          # Ручной: вершину master, на которой workflow запустили.
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.sha }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::В VERSION не semver: «$VERSION»"
            exit 1
          fi
          TAG="v$VERSION"

          # Release уже есть — выпуск сделан, ни текст, ни тег не трогаем.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG уже существует — делать нечего."
            echo "### $TAG уже выпущен — workflow ничего не менял" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Что выпускаем: автоматический запуск — ровно проверенный коммит, ручной — master.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET="$DISPATCH_SHA"
          else
            TARGET="$WORKFLOW_RUN_HEAD_SHA"
          fi
          if ! [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Не удалось определить проверенный коммит: «$TARGET»"
            exit 1
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$TARGET" ]; then
            echo "::error::Checkout дал $HEAD_SHA, а выпускать нужно $TARGET — выпуск остановлен"
            exit 1
          fi

          # master ушёл вперёд — проверенный коммит больше не вершина: выпуск не делаем,
          # иначе тег встал бы на коммит, которого нет в актуальной истории.
          git fetch --no-tags origin "+refs/heads/master:refs/remotes/origin/master"
          MASTER_SHA="$(git rev-parse refs/remotes/origin/master)"
          if [ "$MASTER_SHA" != "$TARGET" ]; then
            if git merge-base --is-ancestor "$TARGET" "$MASTER_SHA"; then
              echo "::notice::origin/master ушёл вперёд ($MASTER_SHA); $TARGET больше не вершина — выпуск не делаем."
              {
                echo "### Выпуск пропущен: master ушёл вперёд"
                echo
                echo "Проверенный коммит: $TARGET"
                echo "Вершина origin/master: $MASTER_SHA"
                echo "Тег $TAG не ставился, Release не создавался."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::error::Проверенный $TARGET не входит в origin/master ($MASTER_SHA) — тег ставить не на что"
            exit 1
          fi

          # Тег поставили руками — Release ляжет на него, но только если он указывает на тот
          # же проверенный коммит: чужой тег не перезаписываем. Тега нет — его создаст сам
          # Release на проверенном коммите. Код 2 у ls-remote значит «нет такого», всё
          # остальное — сбой связи, и принимать его за «нет» нельзя.
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0)
              git fetch --no-tags origin "+refs/tags/$TAG:refs/tags/$TAG"
              TAG_COMMIT="$(git rev-parse "$TAG^{commit}")"
              if [ "$TAG_COMMIT" != "$TARGET" ]; then
                echo "::error::Тег $TAG уже указывает на $TAG_COMMIT, а проверен $TARGET — тег не перезаписываю"
                exit 1
              fi
              TAG_ARGS=(--verify-tag)
              ;;
            2) TAG_ARGS=(--target "$TARGET") ;;
            *) echo "::error::Не удалось спросить у GitHub про тег $TAG (код $rc)"; exit 1 ;;
          esac

          # Заголовок и текст — запись этой версии из CHANGELOG.md, как у прежних выпусков.
          # Без записи выпуск не создаём: пустая страница хуже отсутствующей.
          python3 - "$VERSION" <<'PY'
          import os
          import re
          import sys

          version = sys.argv[1]
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          head = re.compile(r"^##\s+" + re.escape(version) + r"(?:\s+[—–-]\s+(.*?))?\s*$")
          start = next((i for i, line in enumerate(lines) if head.match(line)), None)
          if start is None:
              print(f"::error::В CHANGELOG.md нет записи «## {version} — …»: выпуск без описания не создаём")
              sys.exit(1)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))
          body = "\n".join(lines[start + 1:end]).strip()
          if not body:
              print(f"::error::Запись {version} в CHANGELOG.md пуста")
              sys.exit(1)
          summary = (head.match(lines[start]).group(1) or "").strip()
          tmp = os.environ["RUNNER_TEMP"]
          with open(os.path.join(tmp, "release_title.txt"), "w", encoding="utf-8") as f:
              f.write(f"v{version} — {summary}" if summary else f"v{version}")
          with open(os.path.join(tmp, "release_notes.md"), "w", encoding="utf-8") as f:
              f.write(body + "\n")
          PY

          gh release create "$TAG" "${TAG_ARGS[@]}" \
            --title "$(cat "$RUNNER_TEMP/release_title.txt")" \
            --notes-file "$RUNNER_TEMP/release_notes.md"

          URL="$(gh release view "$TAG" --json url --jq .url)"
          echo "Выпуск создан: $URL"
          {
            echo "### Выпущена $TAG"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
